<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f2a4a">
<title>Civici</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --ink:#0f2a4a; --ink-2:#3b5272; --signal:#ffd400; --paper:#ffffff; --wash:#eef2f7;
  --line:#d3dbe6; --ok:#1a7f4b; --warn:#b26a00; --bad:#c0392b; --blue:#1d6fe0;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--wash);overflow:hidden;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#map{position:fixed;inset:0;z-index:1}
.leaflet-container{font-family:inherit}

/* Barra in alto */
.top{position:fixed;z-index:1000;top:calc(var(--safe-t) + 10px);left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.chip{background:var(--paper);border-radius:12px;padding:0 14px;height:46px;display:inline-flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 1px 3px rgba(15,42,74,.35)}
.chip svg{width:20px;height:20px;flex:none}
#btnList{flex:1;justify-content:flex-start}
#btnList .count{margin-left:auto;background:var(--ink);color:var(--signal);border-radius:999px;padding:2px 10px;font-size:14px;min-width:28px;text-align:center}
#btnLayer{padding:0 12px}
.gps{position:fixed;z-index:1000;top:calc(var(--safe-t) + 64px);left:10px;background:var(--paper);border-radius:999px;padding:6px 12px 6px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:0 1px 3px rgba(15,42,74,.35)}
.gps i{width:10px;height:10px;border-radius:50%;background:#9aa7b8;display:block}
.gps.good i{background:var(--ok)} .gps.mid i{background:#e39b00} .gps.bad i{background:var(--bad)}
#recenter{position:fixed;z-index:1000;right:10px;bottom:calc(var(--safe-b) + 96px);width:52px;height:52px;border-radius:50%;background:var(--paper);box-shadow:0 1px 4px rgba(15,42,74,.45);display:grid;place-items:center}
#recenter svg{width:26px;height:26px;color:var(--ink-2)}
#recenter.on svg{color:var(--blue)}

/* Pulsante principale */
.dock{position:fixed;z-index:1000;left:10px;right:10px;bottom:calc(var(--safe-b) + 12px)}
#saveHere{width:100%;height:68px;border-radius:16px;background:var(--signal);color:var(--ink);font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 8px rgba(15,42,74,.5);border-bottom:4px solid #c9a700}
#saveHere:active{transform:translateY(2px);border-bottom-width:2px}
#saveHere svg{width:26px;height:26px}

/* Segnaposto */
.pin{width:0;height:0}
.pill{position:absolute;left:0;bottom:6px;transform:translateX(-50%);background:var(--ink);color:var(--signal);font-weight:800;font-size:15px;line-height:1;padding:6px 9px;border-radius:8px;border:2px solid #fff;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.pill::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.pill::before{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;margin-top:-1px;border:4px solid transparent;border-top-color:var(--ink);z-index:1}
body.zfar .pill{font-size:0;padding:0;width:12px;height:12px;border-radius:50%;bottom:-6px;border-width:2px}
body.zfar .pill::after,body.zfar .pill::before{display:none}

/* Pannello elenco */
.panel{position:fixed;z-index:1500;left:0;right:0;bottom:0;height:72dvh;max-height:calc(100dvh - var(--safe-t) - 40px);background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(15,42,74,.35);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease;visibility:hidden}
.panel.open{transform:none;visibility:visible}
.panel header{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.panel h2{margin:0;font-size:19px;flex:1}
.x{width:40px;height:40px;border-radius:50%;background:var(--wash);display:grid;place-items:center;font-size:22px;line-height:1}
.search{margin:0 14px 8px;height:46px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;width:calc(100% - 28px);background:#fff}
.search:focus,.field:focus{outline:3px solid var(--signal);border-color:var(--ink)}
#list{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
#list li{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);min-height:56px}
#list li:active{background:var(--wash)}
#list .num{min-width:54px;text-align:center;background:var(--ink);color:var(--signal);font-weight:800;border-radius:8px;padding:7px 8px}
#list .txt{flex:1;min-width:0}
#list .via{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .note{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .d{font-size:14px;font-weight:700;color:var(--ink-2)}
.empty{padding:28px 18px;color:var(--ink-2);line-height:1.45}
.panel footer{padding:10px 14px calc(var(--safe-b) + 12px);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.panel footer .hint{flex-basis:100%;font-size:13px;color:var(--ink-2);margin:0 0 2px}
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--wash);font-weight:700;border:2px solid var(--line)}
.btn.danger{color:var(--bad);margin-left:auto}

/* Finestra di inserimento */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(15,42,74,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(var(--safe-t) + 10px) 10px 10px;overflow:auto}
.modal.open{display:flex}
.card{background:var(--paper);width:100%;max-width:520px;border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.card h2{margin:0 0 12px;font-size:20px}
.card label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px;color:var(--ink-2)}
.field{width:100%;height:50px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:18px;background:#fff}
.numrow{display:flex;gap:6px;align-items:stretch}
.numrow .field{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800}
.step{width:48px;border-radius:12px;background:var(--wash);border:2px solid var(--line);font-weight:800;font-size:16px}
.step:active{background:var(--signal)}
.suf{display:flex;gap:6px;margin-top:8px}
.suf button{flex:1;height:38px;border-radius:10px;background:var(--wash);border:2px solid var(--line);font-weight:800}
.suf button:active{background:var(--signal)}
.hint2{font-size:13px;color:var(--ink-2);margin:12px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.primary{flex:1 1 100%;height:56px;border-radius:14px;background:var(--signal);font-size:19px;font-weight:800;border-bottom:4px solid #c9a700}
.acts .btn{flex:1 1 auto}
.acts .danger{margin-left:0}

#toast{position:fixed;z-index:3000;left:50%;bottom:calc(var(--safe-b) + 104px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.fatal{position:fixed;inset:0;z-index:5000;background:#fff;padding:30px;font-size:17px;line-height:1.5;display:none}
@media (prefers-reduced-motion:reduce){.panel,#toast{transition:none}}
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
  <button class="chip" id="btnList" aria-label="Apri l'elenco dei civici">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    Civici <span class="count" id="count">0</span>
  </button>
  <button class="chip" id="btnLayer" aria-label="Cambia tipo di mappa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
    <span id="layerName">Satellite</span>
  </button>
</div>

<div class="gps" id="gps"><i></i><span id="gpsTxt">Cerco il GPS…</span></div>

<button id="recenter" class="on" aria-label="Torna alla mia posizione">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
</button>

<div class="dock">
  <button id="saveHere">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Salva civico qui
  </button>
</div>

<aside class="panel" id="panel" aria-label="Elenco civici">
  <header>
    <h2 id="panelTitle">Civici salvati</h2>
    <button class="x" id="panelClose" aria-label="Chiudi">×</button>
  </header>
  <input class="search" id="q" type="search" placeholder="Cerca numero, via o nota" autocomplete="off">
  <ul id="list"></ul>
  <footer>
    <p class="hint">Per mettere un civico in un punto preciso, tieni premuto sulla mappa.</p>
    <button class="btn" id="btnExport">Salva copia</button>
    <button class="btn" id="btnImport">Carica copia</button>
    <button class="btn danger" id="btnWipe">Cancella tutto</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </footer>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <h2 id="mTitle">Nuovo civico</h2>

    <label for="fN">Numero civico</label>
    <div class="numrow">
      <button class="step" data-d="-2" type="button">−2</button>
      <button class="step" data-d="-1" type="button">−1</button>
      <input class="field" id="fN" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" enterkeyhint="done">
      <button class="step" data-d="1" type="button">+1</button>
      <button class="step" data-d="2" type="button">+2</button>
    </div>
    <div class="suf">
      <button type="button" data-s="A">A</button>
      <button type="button" data-s="B">B</button>
      <button type="button" data-s="C">C</button>
      <button type="button" data-s="D">D</button>
      <button type="button" data-s="bis">bis</button>
    </div>

    <label for="fV">Via</label>
    <input class="field" id="fV" type="text" list="vie" autocomplete="off" autocapitalize="words">
    <datalist id="vie"></datalist>

    <label for="fT">Nota (facoltativa)</label>
    <input class="field" id="fT" type="text" autocomplete="off" placeholder="es. citofono rotto, cancello a destra">

    <p class="hint2" id="mPos"></p>

    <div class="acts">
      <button class="primary" id="mSave" type="button">Salva</button>
      <button class="btn" id="mCancel" type="button">Annulla</button>
      <button class="btn" id="mNav" type="button">Portami qui</button>
      <button class="btn" id="mMove" type="button">Sposta</button>
      <button class="btn danger" id="mDel" type="button">Elimina</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div class="fatal" id="fatal">Non riesco a caricare la mappa. Serve la connessione internet la prima volta che apri la pagina. Controlla il segnale e ricarica.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
'use strict';
if(!window.L){document.getElementById('fatal').style.display='block';return;}

/* ---------- Utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function dist(a,b){const R=6371000,t=Math.PI/180;const dLa=(b.lat-a.lat)*t,dLo=(b.lng-a.lng)*t;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
const fmt=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.',',')+' km';
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------- Dati (salvati nel telefono) ---------- */
const KEY='civici_v1',LAST='civici_last_v1',LAYER='civici_layer_v1';
let items=[],last={n:'',via:''};
try{const r=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(r))items=r;}catch(e){}
try{const r=JSON.parse(localStorage.getItem(LAST));if(r)last=r;}catch(e){}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(LAST,JSON.stringify(last));return true;}
  catch(e){toast('Non riesco a salvare. Esci dalla navigazione privata e riprova.');return false;}
}

/* ---------- Mappa ---------- */
const map=L.map('map',{zoomControl:false,tap:true}).setView([42.5,12.5],6);
map.attributionControl.setPrefix(false);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
let base='osm';
try{if(localStorage.getItem(LAYER)==='sat')base='sat';}catch(e){}
function applyLayer(){
  map.removeLayer(osm);map.removeLayer(sat);
  (base==='sat'?sat:osm).addTo(map);
  $('#layerName').textContent=base==='sat'?'Mappa':'Satellite';
  try{localStorage.setItem(LAYER,base);}catch(e){}
}
applyLayer();
$('#btnLayer').onclick=()=>{base=base==='osm'?'sat':'osm';applyLayer();};

const grp=L.layerGroup().addTo(map);
const markers=new Map();
function zc(){document.body.classList.toggle('zfar',map.getZoom()<17);}
map.on('zoomend',zc);zc();

function render(){
  grp.clearLayers();markers.clear();
  items.forEach(it=>{
    const m=L.marker([it.lat,it.lng],{
      icon:L.divIcon({className:'pin',html:'<div class="pill">'+esc(it.n)+'</div>',iconSize:[0,0]}),
      keyboard:false
    });
    m.on('click',()=>openModal({edit:it}));
    m.addTo(grp);markers.set(it.id,m);
  });
  $('#count').textContent=items.length;
  renderList();
}

/* ---------- GPS ---------- */
let me=null,meDot=null,meAcc=null,first=true,follow=true;
function setFollow(v){follow=v;$('#recenter').classList.toggle('on',v);}
map.on('dragstart',()=>setFollow(false));
$('#recenter').onclick=()=>{
  setFollow(true);
  if(me)map.setView([me.lat,me.lng],Math.max(map.getZoom(),18));
  else toast('Sto ancora cercando il GPS');
};
function gpsState(cls,txt){const g=$('#gps');g.className='gps '+cls;$('#gpsTxt').textContent=txt;}
function onPos(p){
  const c=p.coords;
  me={lat:c.latitude,lng:c.longitude,acc:c.accuracy};
  const ll=[me.lat,me.lng];
  if(!meDot){
    meAcc=L.circle(ll,{radius:me.acc,weight:1,color:'#1d6fe0',fillOpacity:.12,interactive:false}).addTo(map);
    meDot=L.circleMarker(ll,{radius:8,weight:3,color:'#fff',fillColor:'#1d6fe0',fillOpacity:1,interactive:false}).addTo(map);
  }else{meDot.setLatLng(ll);meAcc.setLatLng(ll);meAcc.setRadius(me.acc);}
  if(first){first=false;map.setView(ll,18);}
  else if(follow){map.panTo(ll,{animate:true});}
  const a=Math.round(me.acc);
  gpsState(a<=15?'good':a<=40?'mid':'bad','GPS ±'+a+' m');
  listSoon();
}
function onErr(e){
  if(e.code===1)gpsState('bad','GPS bloccato: consenti la posizione');
  else gpsState('bad','Nessun segnale GPS');
}
if('geolocation' in navigator){
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:25000});
}else gpsState('bad','GPS non supportato');

/* ---------- Finestra di inserimento / modifica ---------- */
let ctx=null;
const fN=$('#fN'),fV=$('#fV'),fT=$('#fT');

function nearest(pt,maxM){
  let best=null,bd=maxM;
  items.forEach(it=>{const d=dist(pt,it);if(d<bd){bd=d;best=it;}});
  return best;
}
function fillStreets(){
  const set=[...new Set(items.map(i=>i.via).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));
  $('#vie').innerHTML=set.map(v=>'<option value="'+esc(v)+'">').join('');
}
function openModal(c){
  ctx=c;fillStreets();
  const edit=!!c.edit;
  $('#mTitle').textContent=edit?'Modifica civico':'Nuovo civico';
  $('#mSave').textContent=edit?'Salva modifiche':'Salva';
  ['#mNav','#mMove','#mDel'].forEach(s=>$(s).style.display=edit?'':'none');
  if(edit){
    fN.value=c.edit.n;fV.value=c.edit.via||'';fT.value=c.edit.note||'';
    $('#mPos').textContent='Salvato il '+new Date(c.edit.t).toLocaleDateString('it-IT',{day:'numeric',month:'long'})+(c.edit.acc?' · precisione GPS ±'+Math.round(c.edit.acc)+' m':'');
  }else{
    fN.value='';fT.value='';
    const near=nearest({lat:c.lat,lng:c.lng},80);
    fV.value=near&&near.via?near.via:(last.via||'');
    $('#mPos').textContent=c.acc?'Posizione GPS attuale · precisione ±'+Math.round(c.acc)+' m':'Punto scelto sulla mappa';
  }
  fN.placeholder=last.n&&!edit?'dopo il '+last.n:'es. 24/B';
  $('#modal').classList.add('open');
  setTimeout(()=>{fN.focus();fN.select&&fN.select();},60);
}
function closeModal(){$('#modal').classList.remove('open');ctx=null;document.activeElement&&document.activeElement.blur();}
document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{
  const d=parseInt(b.dataset.d,10);
  const base=parseInt(fN.value,10)||parseInt(last.n,10)||0;
  fN.value=Math.max(1,base+d);
});
document.querySelectorAll('.suf button').forEach(b=>b.onclick=()=>{
  const s=b.dataset.s;let v=fN.value.trim();
  if(!v){const l=parseInt(last.n,10);if(l)v=String(l);}
  v=v.replace(/\s*\/?\s*([A-Za-z]+)$/,(m,g)=>/^\d/.test(v)?'':m); // sostituisce un suffisso già presente
  fN.value=v+(s==='bis'?' bis':'/'+s);
});
function submit(){
  if(!ctx)return;
  const n=fN.value.trim(),via=fV.value.trim(),note=fT.value.trim();
  if(!n){fN.focus();toast('Scrivi il numero civico');return;}
  if(ctx.edit){
    Object.assign(ctx.edit,{n,via,note});
  }else{
    const pt={lat:ctx.lat,lng:ctx.lng};
    const dup=items.find(i=>i.n.toLowerCase()===n.toLowerCase()&&(i.via||'').toLowerCase()===via.toLowerCase()&&dist(pt,i)<25);
    if(dup){
      if(confirm('Il civico '+n+' esiste già qui vicino. Vuoi spostarlo in questo punto?')){
        Object.assign(dup,{lat:pt.lat,lng:pt.lng,acc:ctx.acc||null,note:note||dup.note,t:Date.now()});
      }else return;
    }else{
      items.push({id:uid(),n,via,note,lat:pt.lat,lng:pt.lng,acc:ctx.acc||null,t:Date.now()});
    }
  }
  last={n,via};
  if(persist()){render();closeModal();toast('Civico '+n+' salvato');}
}
$('#mSave').onclick=submit;
$('#mCancel').onclick=closeModal;
[fN,fV,fT].forEach(f=>f.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}}));
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePanel();}});

$('#mNav').onclick=()=>{
  const it=ctx&&ctx.edit;if(!it)return;
  window.open('https://www.google.com/maps/dir/?api=1&destination='+it.lat+','+it.lng,'_blank');
};
$('#mDel').onclick=()=>{
  const it=ctx&&ctx.edit;if(!it)return;
  if(!confirm('Eliminare il civico '+it.n+(it.via?' di '+it.via:'')+'?'))return;
  items=items.filter(i=>i.id!==it.id);
  if(persist()){render();closeModal();toast('Civico eliminato');}
};
$('#mMove').onclick=()=>{
  const it=ctx&&ctx.edit;if(!it)return;
  const m=markers.get(it.id);closeModal();
  map.setView([it.lat,it.lng],Math.max(map.getZoom(),19));
  m.dragging.enable();
  toast('Trascina il segnaposto dove serve');
  m.once('dragend',()=>{
    const ll=m.getLatLng();it.lat=ll.lat;it.lng=ll.lng;it.acc=null;
    m.dragging.disable();persist();toast('Posizione aggiornata');
  });
};

/* Salva qui (GPS) e pressione lunga sulla mappa */
$('#saveHere').onclick=()=>{
  if(!me){toast('Aspetta il segnale GPS e riprova');return;}
  openModal({lat:me.lat,lng:me.lng,acc:me.acc});
};
map.on('contextmenu',e=>openModal({lat:e.latlng.lat,lng:e.latlng.lng,acc:null}));

/* ---------- Elenco ---------- */
const panel=$('#panel');
function openPanel(){panel.classList.add('open');renderList();}
function closePanel(){panel.classList.remove('open');$('#q').blur();}
$('#btnList').onclick=openPanel;
$('#panelClose').onclick=closePanel;
$('#q').addEventListener('input',renderList);
let lt=null;
function listSoon(){if(!panel.classList.contains('open'))return;clearTimeout(lt);lt=setTimeout(renderList,1500);}
function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  let arr=items.filter(i=>!q||(i.n+' '+(i.via||'')+' '+(i.note||'')).toLowerCase().includes(q));
  if(me)arr.forEach(i=>i._d=dist(me,i));
  arr.sort(me?(a,b)=>a._d-b._d:(a,b)=>b.t-a.t);
  $('#panelTitle').textContent=q?arr.length+' trovati':'Civici salvati';
  const ul=$('#list');
  if(!arr.length){
    ul.innerHTML='<li class="empty" style="display:block;border:0">'+(items.length
      ?'Nessun risultato.'
      :'Ancora nessun civico. Vai davanti a una casa e tocca <b>Salva civico qui</b>.')+'</li>';
    return;
  }
  ul.innerHTML=arr.slice(0,250).map(i=>
    '<li data-id="'+i.id+'"><span class="num">'+esc(i.n)+'</span><div class="txt"><div class="via">'+esc(i.via||'Via non indicata')+'</div>'
    +(i.note?'<div class="note">'+esc(i.note)+'</div>':'')+'</div>'
    +(me?'<span class="d">'+fmt(i._d)+'</span>':'')+'</li>').join('');
}
$('#list').addEventListener('click',e=>{
  const li=e.target.closest('li[data-id]');if(!li)return;
  const it=items.find(i=>i.id===li.dataset.id);if(!it)return;
  closePanel();setFollow(false);
  map.setView([it.lat,it.lng],19);
});

/* ---------- Copia di sicurezza ---------- */
$('#btnExport').onclick=async()=>{
  if(!items.length){toast('Non c\'è ancora niente da salvare');return;}
  const name='civici-'+new Date().toISOString().slice(0,10)+'.json';
  const blob=new Blob([JSON.stringify({versione:1,civici:items})],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia civici'});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Copia scaricata');
};
$('#btnImport').onclick=()=>$('#file').click();
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const arr=Array.isArray(d)?d:(d.civici||d.items||[]);
      let add=0,upd=0;
      arr.forEach(x=>{
        if(!x||typeof x.lat!=='number'||typeof x.lng!=='number'||x.n==null)return;
        const rec={id:x.id||uid(),n:String(x.n),via:x.via||'',note:x.note||'',lat:x.lat,lng:x.lng,acc:x.acc||null,t:x.t||Date.now()};
        const i=items.findIndex(k=>k.id===rec.id);
        if(i>=0){items[i]=rec;upd++;}else{items.push(rec);add++;}
      });
      persist();render();toast(add+' aggiunti, '+upd+' aggiornati');
    }catch(err){toast('File non valido');}
    e.target.value='';
  };
  r.readAsText(f);
});
$('#btnWipe').onclick=()=>{
  if(!items.length)return;
  if(!confirm('Cancellare tutti i '+items.length+' civici dal telefono? Se non hai fatto una copia, non si recuperano.'))return;
  if(!confirm('Sicuro? Questa azione non si può annullare.'))return;
  items=[];last={n:'',via:''};persist();render();toast('Tutto cancellato');
};

render();
})();
</script>
</body>
</html>
